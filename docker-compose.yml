# Local development and demo. The passwords and keys below are throwaway local placeholders,
# overridable from .env. Never commit a real credential.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: supportdesk-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Local_Dev_Password1}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - supportdesk-sql:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    image: supportdesk-api:local
    container_name: supportdesk-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # Starts only once SQL Server reports healthy.
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "${API_ENVIRONMENT:-Production}"
      # SQL Server is reached by its service name, not localhost.
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=SupportDesk;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Local_Dev_Password1};TrustServerCertificate=True;Encrypt=False"
      Jwt__SigningKey: "${Jwt__SigningKey:-docker-demo-signing-key-local-only-0123456789abcdef}"
      # Demo only: on an empty volume the API applies migrations, seeds demo data and gives the
      # agents this password. A real deployment would do none of this (see the README).
      Database__MigrateAndSeedOnStartup: "true"
      Seed__AgentPassword: "${Seed__AgentPassword:-LocalDevOnly!123}"
    ports:
      - "5080:8080"

volumes:
  supportdesk-sql: